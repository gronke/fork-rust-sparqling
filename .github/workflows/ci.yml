name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test (default features)
        run: cargo test

      - name: Test (all features)
        run: cargo test --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Resolve dependencies compatible with rust-version, not the newest.
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
      - name: Resolve at the MSRV
        run: cargo +stable generate-lockfile
      - name: Check at the MSRV
        run: cargo +1.75 check --all-targets --all-features --locked
      - name: Test at the MSRV
        run: cargo +1.75 test --all-features --locked
